[project]
name = "agent-systems-fieldbook-tools"
version = "0.1.0"
description = "Validation and catalog tooling for the Agent Systems Fieldbook"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
