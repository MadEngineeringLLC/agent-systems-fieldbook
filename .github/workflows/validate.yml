name: Validate fieldbook

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify generated catalog
        run: python scripts/build_catalog.py --check

      - name: Validate metadata and repository files
        run: python scripts/validate_archive.py

      - name: Check internal links
        run: python scripts/check_internal_links.py

      - name: Compile repository tooling
        run: python -m compileall -q scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check whitespace errors
        run: git diff --check
