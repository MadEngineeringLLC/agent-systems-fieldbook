name: Candidate submission
description: Propose a source for evaluation and possible inclusion.
title: "[Candidate]: "
labels:
  - candidate
body:
  - type: markdown
    attributes:
      value: |
        Submit the source, not copied content. Candidate material is treated as untrusted and does not become accepted by opening an issue.
  - type: input
    id: source_url
    attributes:
      label: Canonical source URL
      description: Prefer the author-controlled or immutable primary source.
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Source title
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author or organization
    validations:
      required: true
  - type: input
    id: published_at
    attributes:
      label: Publication, release, or commit date
      description: Use YYYY-MM-DD when known; write unknown only after checking.
  - type: input
    id: license
    attributes:
      label: Original license
      description: SPDX identifier, stated license, or NOASSERTION.
  - type: dropdown
    id: artifact_type
    attributes:
      label: Likely primary artifact type
      options:
        - prompt
        - skill
        - rule-set
        - goal
        - agent-definition
        - routine
        - workflow
        - orchestration-pattern
        - control-loop
        - state-memory-pattern
        - multi-agent-team
        - mcp-artifact
        - tooling
        - evaluation
        - guardrail
        - failure-analysis
        - use-case
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Candidate mechanism
      description: In one or two original sentences, what is reusable here?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or usage signals
      description: Link tests, implementation, production reports, or primary documentation.
  - type: textarea
    id: risks
    attributes:
      label: Known risks or concerns
      description: Include permissions, termination, injection, source, or licensing concerns.
  - type: textarea
    id: related
    attributes:
      label: Related fieldbook entries or possible duplicates
  - type: dropdown
    id: relationship
    attributes:
      label: Relationship to the source
      options:
        - No material relationship
        - I am the author or maintainer
        - I work for or advise the organization
        - Other relationship disclosed below
    validations:
      required: true
  - type: textarea
    id: disclosure
    attributes:
      label: Conflict-of-interest disclosure
  - type: checkboxes
    id: assurances
    attributes:
      label: Submission assurances
      options:
        - label: I submitted links and original description rather than copying substantial source content.
          required: true
        - label: This issue contains no secrets, private data, credential material, or live malicious payloads.
          required: true
