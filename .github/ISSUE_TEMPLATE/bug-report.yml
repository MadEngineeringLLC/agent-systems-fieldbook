name: Repository or validation problem
description: Report a broken schema, catalog, link, script, or documentation behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, and which file or command is affected?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reproducible steps and exact command output.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository revision
      description: Commit SHA or branch.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant tool versions.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not disclose a secret, exploit, malicious payload, or private data. Security reports follow SECURITY.md.
          required: true
